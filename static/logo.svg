<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="aivilli">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#39d98a"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c9bdff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </radialGradient>
  </defs>

  <!-- rounded hexagonal cell -->
  <path d="M32 3.5 L54.7 16.75 A3 3 0 0 1 56 19.35 L56 44.65 A3 3 0 0 1 54.7 47.25 L32 60.5 L9.3 47.25 A3 3 0 0 1 8 44.65 L8 19.35 A3 3 0 0 1 9.3 16.75 Z"
        fill="none" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- links from the core to three satellites -->
  <g stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="32" x2="32" y2="13.5"/>
    <line x1="32" y1="32" x2="48.5" y2="41.5"/>
    <line x1="32" y1="32" x2="15.5" y2="41.5"/>
  </g>

  <!-- mind core -->
  <circle cx="32" cy="32" r="8.4" fill="url(#core)"/>
  <circle cx="32" cy="32" r="3.1" fill="#0b0d10"/>

  <!-- satellite agents -->
  <g fill="#39d98a">
    <circle cx="32" cy="13.5" r="4"/>
    <circle cx="48.5" cy="41.5" r="4"/>
    <circle cx="15.5" cy="41.5" r="4"/>
  </g>
</svg>
